specVersion: 0.0.8
description: >-
  ENSv2 (Sepolia public beta, deployed 2026-08-11) indexed through the v1 ENS
  subgraph schema for drop-in retrocompatibility. Addresses/startBlocks pinned
  in networks.json; see docs/PLAN.md.
repository: "https://github.com/ensdomains/contracts-v2"
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ETHRegistry
    network: sepolia
    source:
      address: "0xDEDB92913A25abE1f7BCDD85D8A344a43B398B67"
      startBlock: 11465480
      abi: PermissionedRegistry
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.8
      language: wasm/assemblyscript
      entities:
        - Domain
        - Account
        - Registration
        - Resolver
      abis:
        - name: PermissionedRegistry
          file: ./abis/live/ETHRegistry.json
      eventHandlers:
        - event: LabelRegistered(indexed uint256,indexed bytes32,string,address,uint64,indexed address)
          handler: handleLabelRegistered
        - event: LabelReserved(indexed uint256,indexed bytes32,string,uint64,indexed address)
          handler: handleLabelReserved
        - event: LabelUnregistered(indexed uint256,indexed address)
          handler: handleLabelUnregistered
        - event: ExpiryUpdated(indexed uint256,indexed uint64,indexed address)
          handler: handleExpiryUpdated
        - event: SubregistryUpdated(indexed uint256,indexed address,indexed address)
          handler: handleSubregistryUpdated
        - event: ResolverUpdated(indexed uint256,indexed address,indexed address)
          handler: handleResolverUpdated
        - event: TokenRegenerated(indexed uint256,indexed uint256)
          handler: handleTokenRegenerated
        - event: TokenResource(indexed uint256,indexed uint256)
          handler: handleTokenResource
        - event: RegistryCreated()
          handler: handleRegistryCreated
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])
          handler: handleTransferBatch
        - event: EACRolesChanged(indexed uint256,indexed address,uint256,uint256)
          handler: handleEACRolesChanged
      file: ./src/registry.ts
  - kind: ethereum
    name: RootRegistry
    network: sepolia
    source:
      address: "0xc960F7217d3643B525Ef36Bec8Adf86953CD9aB8"
      startBlock: 11465480
      abi: PermissionedRegistry
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.8
      language: wasm/assemblyscript
      entities:
        - Domain
        - Account
      abis:
        - name: PermissionedRegistry
          file: ./abis/live/ETHRegistry.json
      eventHandlers:
        - event: LabelRegistered(indexed uint256,indexed bytes32,string,address,uint64,indexed address)
          handler: handleRootLabelRegistered
        - event: SubregistryUpdated(indexed uint256,indexed address,indexed address)
          handler: handleRootSubregistryUpdated
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleRootTransferSingle
      file: ./src/registry.ts
  - kind: ethereum
    name: ETHRegistrar
    network: sepolia
    source:
      address: "0x8c2E866B439358c41AE05De9cbE8A00BFEFafFcA"
      startBlock: 11479218
      abi: ETHRegistrar
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.8
      language: wasm/assemblyscript
      entities:
        - Registration
        - Domain
        - Account
      abis:
        - name: ETHRegistrar
          file: ./abis/live/ETHRegistrar.json
      eventHandlers:
        - event: NameRegistered(indexed uint256,string,address,address,address,uint64,address,indexed bytes32,uint256,uint256)
          handler: handleRegistrarNameRegistered
        - event: NameRenewed(indexed uint256,string,uint64,uint64,address,indexed bytes32,uint256)
          handler: handleRegistrarNameRenewed
      file: ./src/registrar.ts
  - kind: ethereum
    name: VerifiableFactory
    network: sepolia
    source:
      address: "0xD2a632D8a8b67c2c4398c255CbD7aF8dd7236198"
      startBlock: 11465480
      abi: VerifiableFactory
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.8
      language: wasm/assemblyscript
      entities: []
      abis:
        - name: VerifiableFactory
          file: ./abis/live/VerifiableFactory.json
      eventHandlers:
        - event: ProxyDeployed(indexed address,indexed address,uint256,address)
          handler: handleProxyDeployed
      file: ./src/factory.ts
templates:
  - kind: ethereum
    name: Subregistry
    network: sepolia
    source:
      abi: UserRegistry
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.8
      language: wasm/assemblyscript
      entities:
        - Domain
        - Account
        - Resolver
      abis:
        - name: UserRegistry
          file: ./abis/live/UserRegistry.json
      eventHandlers:
        - event: LabelRegistered(indexed uint256,indexed bytes32,string,address,uint64,indexed address)
          handler: handleSubregistryLabelRegistered
        - event: LabelUnregistered(indexed uint256,indexed address)
          handler: handleSubregistryLabelUnregistered
        - event: ExpiryUpdated(indexed uint256,indexed uint64,indexed address)
          handler: handleSubregistryExpiryUpdated
        - event: SubregistryUpdated(indexed uint256,indexed address,indexed address)
          handler: handleSubregistrySubregistryUpdated
        - event: ResolverUpdated(indexed uint256,indexed address,indexed address)
          handler: handleSubregistryResolverUpdated
        - event: TokenRegenerated(indexed uint256,indexed uint256)
          handler: handleSubregistryTokenRegenerated
        - event: TokenResource(indexed uint256,indexed uint256)
          handler: handleSubregistryTokenResource
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleSubregistryTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])
          handler: handleSubregistryTransferBatch
      file: ./src/registry.ts
  - kind: ethereum
    name: ResolverLive
    network: sepolia
    source:
      abi: PermissionedResolver
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.8
      language: wasm/assemblyscript
      entities:
        - Resolver
        - Domain
        - Account
      abis:
        - name: PermissionedResolver
          file: ./abis/live/PermissionedResolver.json
      eventHandlers:
        - event: AddrChanged(indexed bytes32,address)
          handler: handleAddrChanged
        - event: AddressChanged(indexed bytes32,uint256,bytes)
          handler: handleAddressChanged
        - event: TextChanged(indexed bytes32,indexed string,string,string)
          handler: handleTextChanged
        - event: ContenthashChanged(indexed bytes32,bytes)
          handler: handleContenthashChanged
        - event: ABIChanged(indexed bytes32,indexed uint256)
          handler: handleABIChanged
        - event: InterfaceChanged(indexed bytes32,indexed bytes4,address)
          handler: handleInterfaceChanged
        - event: PubkeyChanged(indexed bytes32,bytes32,bytes32)
          handler: handlePubkeyChanged
        - event: NameChanged(indexed bytes32,string)
          handler: handleNameChanged
        - event: VersionChanged(indexed bytes32,uint64)
          handler: handleVersionChanged
      file: ./src/resolverLive.ts
